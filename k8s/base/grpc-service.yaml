apiVersion: v1
kind: Service
metadata:
  name: go-grpc-k8s-service      # A stable service name (DNS address)
spec:
  type: NodePort            # Makes your app accessible outside the cluster
  selector:
    app: micro-app-boilerplate-go-grpc    # Match Pods with this label
  ports:
    - port: 9090            # Service port (cluster-wide port)
      nodePort: 30090       # Port on each Kubernetes node
